[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trp"
version = "0.5.1"
description = "Trust Requirements Profile: an open standard for stating and verifying the trust requirements of AI and autonomous systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Striv AI" },
    { name = "AI Trust Alliance" },
]
keywords = [
    "ai-governance", "trust", "conformance", "verification",
    "ai-safety", "compliance", "autonomous-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/aitrustalliance/trp"
Repository = "https://github.com/aitrustalliance/trp"
Specification = "https://doi.org/10.5281/zenodo.22099403"

[project.scripts]
trp = "trp.cli:main"

[tool.setuptools]
packages = ["trp"]

[tool.setuptools.package-data]
trp = ["schema/*.json", "profiles/*.json"]
